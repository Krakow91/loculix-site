<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- Filing Cabinet Icon (Pure Icon version) -->
  <g transform="translate(4, 4)">
    <!-- Cabinet body -->
    <rect x="2" y="6" width="28" height="26" rx="3" fill="#5C4033" opacity="0.15"/>
    <rect x="3" y="7" width="26" height="24" rx="2.5" stroke="#5C4033" stroke-width="2" fill="none"/>
    <!-- Divider line -->
    <line x1="4" y1="19" x2="28" y2="19" stroke="#5C4033" stroke-width="1.5" opacity="0.6"/>
    <!-- Drawer handles -->
    <circle cx="16" cy="13" r="2" fill="#B8960C"/>
    <circle cx="16" cy="25" r="2" fill="#B8960C"/>
    <!-- Folder tab sticking out -->
    <rect x="6" y="2" width="14" height="6" rx="1.5" fill="#B8960C"/>
  </g>
</svg>
